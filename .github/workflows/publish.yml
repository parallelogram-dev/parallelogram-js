name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the tag and the branch
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run coverage
      - run: npm run test:browser
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:doc-imports
      - run: npm run check:logger
      - run: npm run check:package
      - run: npm run check:types
      - run: npm run check:size

      - name: Pack
        id: pack
        run: |
          tarball=$(npm pack --ignore-scripts --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check npm
        run: |
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error('::error::Trusted publishing needs npm 11.5.1 or later, found ' + process.argv[1]);
              process.exit(1);
            }
          " "$(npm --version)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package

      - name: Publish to npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARBALL: ${{ needs.check.outputs.tarball }}
        run: |
          case "$VERSION" in
            *-*) npm publish "./$TARBALL" --tag next ;;
            *) npm publish "./$TARBALL" ;;
          esac
